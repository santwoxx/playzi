      .loader-progress {

      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }

      @keyframes loading {
        0% { left: -30%; }
        100% { left: 100%; }
      }

    <script>
      // Fast dismissal function called directly by React mount or window load
      window.__dismissInitialLoader = function() {
        const loader = document.getElementById('initial-loader');
        if (loader && !loader.getAttribute('data-dismissed')) {
          loader.setAttribute('data-dismissed', 'true');
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 350);
        }
      };

      // Failsafe triggers so loader never hangs waiting for third-party scripts
      window.addEventListener('load', window.__dismissInitialLoader);
      setTimeout(window.__dismissInitialLoader, 1500);
    </script>
